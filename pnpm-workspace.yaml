packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  workerd: true

# @stylexjs/unplugin 0.19.2 still declares unplugin ^2.3.11; unplugin 3 works with it.
peerDependencyRules:
  allowedVersions:
    "@stylexjs/unplugin>unplugin": "3"

permissions:
  "@solidjs/diagnostics":
    skills: false
  "@solidjs/web":
    skills: false
  solid-js:
    skills: false
  tsdown:
    skills: false

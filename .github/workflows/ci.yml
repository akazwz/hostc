name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      # The oldest Node.js the CLI supports ("engines" in apps/cli/package.json).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cp apps/server/.env.example apps/server/.env
      # The end-to-end tests run against the packed CLI, installed the way npm users get it.
      - run: pnpm -F hostc pack --pack-destination "$RUNNER_TEMP"
      - run: pnpm -F hostc test:package "$RUNNER_TEMP"/hostc-*.tgz
